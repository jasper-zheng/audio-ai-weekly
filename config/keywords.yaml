# ============================================================
# arXiv paper filtering settings
# Edit only this file to add or remove keywords.
# ============================================================

# Target arXiv categories
categories:
  - cs.SD
  - eess.AS

# Filtering keywords (OR condition)
# Include papers whose title or abstract contains any of these terms.
include:
  # Audio foundation models
  - audio foundation model
  - audio language model
  - audio large language model
  - sound foundation model
  - music foundation model
  - audio pre-training
  - audio self-supervised
  - universal audio
  # Audio generative models
  - audio generative model
  - audio generation
  - audio synthesis
  - music generation
  - music synthesis
  - sound generation
  - sound synthesis
  # Neural audio codec
  - neural audio codec
  - neural audio compression
  - audio autoencoder

# Exclusion keywords override include matches.
exclude:
  - survey only
  - retracted

# Category definitions displayed in the UI
ui_categories:
  - id: foundation
    label: 音の基盤モデル
    labelEn: Audio Foundation Models
    labelZh: 音频基础模型
    color: "#38bdf8"
    keywords:
      - audio foundation model
      - audio language model
      - audio large language model
      - sound foundation model
      - music foundation model
      - audio pre-training
      - audio self-supervised
      - universal audio

  - id: generation
    label: 音声生成
    labelEn: Audio Generation
    labelZh: 音频生成
    color: "#4ade80"
    keywords:
      - audio generative model
      - audio generation
      - audio synthesis
      - music generation
      - music synthesis
      - sound generation
      - sound synthesis

  - id: codec
    label: 音声コーデック
    labelEn: Audio Codec
    labelZh: 音频编解码
    color: "#fb923c"
    keywords:
      - neural audio codec
      - neural audio compression
      - audio autoencoder