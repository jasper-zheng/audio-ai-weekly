# ============================================================
# System settings
# ============================================================

# arXiv retrieval settings
arxiv:
  lookback_days: 7          # Retrieval window in days
  max_papers: 50            # Maximum papers after filtering
  catchup_max_days: 28      # Maximum automatic catch-up window; fail if exceeded
  catchup_max_papers: 200   # Maximum papers during automatic catch-up
  request_interval: 3.0     # Interval between API requests in seconds
  request_timeout: 30       # API request timeout in seconds
  retry_max: 3              # Maximum API attempts
  retry_interval: 5.0       # Initial retry interval in seconds
  user_agent: "audio-ai-weekly/1.0 (github.com/jasper-zheng/audio-ai-weekly)"
  page_size: 100             # Papers requested per arXiv API page
  id_verification_batch_size: 50 # Related-paper IDs verified per API request
  max_authors: 5             # Authors retained in published data
  max_affiliation_length: 60
  retryable_http_statuses: [429, 500, 502, 503, 504]

# External metadata API settings
metadata:
  user_agent: "audio-ai-weekly/1.0 (github.com/jasper-zheng/audio-ai-weekly)"
  request_timeout: 10
  arxiv_request_timeout: 15
  paper_interval: 0.5
  huggingface_interval: 0.3

# Analysis and report-generation settings
analysis:
  # Gemini is the only configured provider since GitHub Models was retired on
  # 2026-07-30, so there is nothing to fall back to and analysis fails closed.
  fallback_providers: []
  prompt_authors: 3
  temperature: 0.3
  enrichment_tokens_per_paper: 800
  trend_paper_limit: 20
  trend_line_count: 3
  trend_temperature: 0.4
  connection_max_tokens: 500

# Twice-monthly long-form feature generation.
features:
  recent_days: 56
  topic_candidate_limit: 40
  prior_topic_limit: 12
  archive_source_min: 4
  archive_source_max: 6
  external_source_min: 2
  source_target: 8
  primary_link_min: 1
  external_candidate_limit: 24
  search_term_min: 2
  search_term_max: 5
  perspective_count: 3
  section_min: 6
  primer_sections: [why-needed, history, approaches, perspectives, limits, outlook]
  debate_sections: [current-signal, positions, evidence, evaluation, implications, watch]
  target_min_chars: 3500
  target_max_chars: 5000
  validation_min_chars: 3151
  validation_max_chars: 5400
  reading_chars_per_minute: 450
  reading_minutes_min: 8
  reading_minutes_max: 12
  japanese_body_min_ratio: 0.5
  japanese_metadata_min_ratio: 0.25
  english_body_target_min_words: 800
  english_body_target_max_words: 1100
  english_body_validation_min_words: 700
  english_body_validation_max_words: 1300
  english_reading_words_per_minute: 225
  english_summary_min_words: 60
  english_summary_max_words: 250
  # Simplified Chinese edition. Chinese is denser than Japanese, so the character
  # band is ~0.6x the Japanese one for the same canonical English body.
  # INVARIANT: ceil(chinese_validation_min_chars / chinese_reading_chars_per_minute)
  # must equal reading_minutes_min, and the max counterpart reading_minutes_max.
  # ceil(1900/270) == 8 and ceil(3200/270) == 12, so the Chinese edition reuses the
  # shared 8-12 minute band. Guarded by a test; see tests/test_generate_feature.py.
  chinese_target_min_chars: 2100
  chinese_target_max_chars: 2900
  chinese_validation_min_chars: 1900
  chinese_validation_max_chars: 3200
  chinese_reading_chars_per_minute: 270
  chinese_body_min_ratio: 0.5
  chinese_metadata_min_ratio: 0.25
  # Chinese never uses kana, so any meaningful kana density means the model
  # returned Japanese. A ratio (not a presence test) tolerates a stray "・"/"ー".
  chinese_kana_max_ratio: 0.01
  # Target languages translated from the canonical English edition, in order.
  translation_target_languages: [ja, zh]
  selection_max_tokens: 16000
  generation_max_tokens: 16000
  verification_max_tokens: 16000
  revision_max_tokens: 16000
  grounding_patch_max_tokens: 4000
  translation_max_tokens: 4000
  translation_verification_max_tokens: 4000
  model_max_tokens: 64000
  feature_generation_reasoning_effort: low
  single_revision_reasoning_effort: low
  grounding_patch_reasoning_effort: low
  feature_translation_reasoning_effort: low
  translation_verification_reasoning_effort: low
  temperature: 0.2
  request_timeout: 30
  model_timeout: 180
  model_retry_max: 6
  model_retry_interval: 15.0
  model_retry_max_interval: 240.0
  # No second provider exists, so the fallback machinery in JsonModel never fires
  # and model_fallback_after is inert. Both are kept so adding a provider block is
  # a config change rather than a code change.
  model_fallback_providers: []
  model_fallback_after: 2
  # Spend circuit-breaker for a single feature run, NOT a worst-case sizing: one
  # budget unit is consumed per HTTP attempt (max_retries=0), so model_retry_max
  # multiplies every logical call. A feature run costs ~11 logical calls on the
  # happy path with the ja+zh translation legs; 40 leaves room for roughly one
  # full retry per language. Scoped here rather than on the provider so the
  # multi-week loops in enrich_data.py and backfill.py stay unbudgeted.
  request_limit_per_run: 40
  selection_validation_retry_max: 3
  english_generation_validation_retry_max: 3
  translation_retry_max: 3
  translation_block_batch_max: 3
  short_body_expansion_retry_max: 2
  verification_revision_max: 4
  grounding_patch_retry_max: 3
  grounding_patch_block_max: 3
  arxiv_retry_max: 3
  arxiv_retry_interval: 15.0
  arxiv_retry_max_interval: 120.0
  retry_max: 3
  retry_interval: 5.0
  retryable_http_statuses: [429, 500, 502, 503, 504]
  output_dir: "data/features"

# Historical backfill settings
backfill:
  weekday: 4                 # Monday=0, Friday=4
  interval_days: 7
  week_interval: 90.0

# AI provider selection. GitHub Models was fully retired on 2026-07-30, so gemini
# is the only provider block; add another block here to make it selectable.
ai:
  provider: "gemini"

# Gemini settings (OpenAI-compatible API)
gemini:
  api_key_env: "GEMINI_API_KEY"
  endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model: "gemini-3.5-flash"
  feature_max_tokens: 64000
  max_tokens: 16000
  batch_size: 5
  batch_max_tokens: 32000
  min_request_interval: 60.0
  retry_max: 3
  retry_interval: 5.0       # Retry interval in seconds

# Data output settings
data:
  weekly_dir: "data/weekly"
  index_file: "data/index.json"
